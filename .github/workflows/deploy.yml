# ABOUTME: Deploys the badges Worker to production when a change lands on main
# ABOUTME: Runs the same checks as the PR workflow before shipping, gated on Cloudflare credentials

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    # workflow_dispatch can target any branch; only main ships to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install wasm Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Run native checks
        run: npm run check

      - name: Run wasm check
        run: npm run check:wasm

      - name: Install worker-build
        run: cargo install worker-build --version 0.8.1 --locked

      - name: Check Cloudflare deployment secrets
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are not both set; skipping deploy."
          fi

      # A re-run keeps its original commit, so re-running an old run would roll
      # production back. Only ship the commit that is still the head of main.
      - name: Check commit is still the head of main
        id: head
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main is now at ${head:-unknown}, not $GITHUB_SHA; skipping deploy of a stale commit."
          fi

      - name: Deploy Worker
        if: steps.secrets.outputs.configured == 'true' && steps.head.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
